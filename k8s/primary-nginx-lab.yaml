apiVersion: v1
kind: Namespace
metadata:
  name: oke-dr-lab
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nginx-block-pvc
  namespace: oke-dr-lab
spec:
  storageClassName: oci-bv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nginx-fss-pv
spec:
  capacity:
    storage: 50Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: oci-fss
  csi:
    driver: fss.csi.oraclecloud.com
    volumeHandle: ocid1.filesystem.oc1.eu_frankfurt_1.aaaaaaaaaan5hy3wmzzgcllqojxwiotfouwwm4tbnzvwm5lsoqwtcllbmqwtcaaa:10.10.10.207:/oke
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nginx-fss-pvc
  namespace: oke-dr-lab
spec:
  storageClassName: oci-fss
  volumeName: nginx-fss-pv
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-lab
  namespace: oke-dr-lab
  labels:
    app.kubernetes.io/name: nginx-lab
    app.kubernetes.io/part-of: oke-dr-hands-on-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx-lab
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx-lab
        app.kubernetes.io/part-of: oke-dr-hands-on-lab
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: block-storage
              mountPath: /data/block
            - name: file-storage
              mountPath: /data/fss
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: block-storage
          persistentVolumeClaim:
            claimName: nginx-block-pvc
        - name: file-storage
          persistentVolumeClaim:
            claimName: nginx-fss-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-lab
  namespace: oke-dr-lab
  labels:
    app.kubernetes.io/name: nginx-lab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nginx-lab
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: istio
spec:
  controller: istio.io/ingress-controller
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-lab
  namespace: oke-dr-lab
  labels:
    app.kubernetes.io/name: nginx-lab
  annotations:
    kubernetes.io/ingress.class: istio
spec:
  ingressClassName: istio
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-lab
                port:
                  number: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-web-content
  namespace: oke-dr-lab
  labels:
    app.kubernetes.io/name: nginx-web
    app.kubernetes.io/part-of: oke-dr-hands-on-lab
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>OKE DR Istio Web App</title>
    </head>
    <body>
      <h1>OKE DR Istio Web App</h1>
      <p>This nginx web app is exposed through the Istio ingress class.</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-web
  namespace: oke-dr-lab
  labels:
    app.kubernetes.io/name: nginx-web
    app.kubernetes.io/part-of: oke-dr-hands-on-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx-web
        app.kubernetes.io/part-of: oke-dr-hands-on-lab
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: web-content
          configMap:
            name: nginx-web-content
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-web
  namespace: oke-dr-lab
  labels:
    app.kubernetes.io/name: nginx-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nginx-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-web
  namespace: oke-dr-lab
  labels:
    app.kubernetes.io/name: nginx-web
  annotations:
    kubernetes.io/ingress.class: istio
spec:
  ingressClassName: istio
  rules:
    - host: web.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-web
                port:
                  number: 80
